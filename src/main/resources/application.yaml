spring:
  application:
    name: finbank-auth-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    producer:
      # key/value serializers are wired via config/KafkaProducerConfig.java (needs a
      # LocalDateTime-aware ObjectMapper), not by class name here.
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

app:
  security:
    jwt:
      access-token-ttl-minutes: 15
    refresh-token:
      ttl-days: 7
    session:
      max-devices: 5
    login:
      max-failed-attempts: 5
      lockout-minutes: 30
    password-reset:
      ttl-minutes: 15
    # Optional first-ADMIN seed (BootstrapAdminRunner) -- no-op unless all three are set AND
    # no ADMIN exists yet. Leave unset once you have a real ADMIN.
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  # StaleRecordCleanupJob: daily at 03:00 by default, deletes REVOKED/EXPIRED sessions and
  # USED/EXPIRED password-reset tokens older than retention-days.
  cleanup:
    cron: "0 0 3 * * *"
    retention-days: 30
