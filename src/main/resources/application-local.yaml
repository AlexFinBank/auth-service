spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/finbank_auth
    username: ${DB_USERNAME:finbank}
    password: ${DB_PASSWORD:finbank}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

app:
  security:
    jwt:
      # Random 512-bit dev-only default (openssl rand -hex 64) -- override via JWT_SECRET env
      # var for anything beyond a local machine. Never reuse this value in prod.
      secret: ${JWT_SECRET:20118f357fe78c0b3c672f4837c3eae043200b46f69bd4e60d51bc2f7a9f9c90eb9451454df415599e565a99f15b1a1ee4848e19804bce8c31738d5d5ada547d}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    uz.finbank.finbankauthservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
